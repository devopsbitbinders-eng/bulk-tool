<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bitbinders Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .gradient-text { background: linear-gradient(135deg, #10b981 0%, #059669 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body class="bg-[#f8fafc] min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md animate-in fade-in zoom-in duration-500">
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-100 mb-4 shadow-inner">
                <svg class="w-8 h-8 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-3xl font-bold text-slate-900 mb-2">Welcome Back</h1>
            <p class="text-slate-500 font-medium">Log in to your Bitbinders Messenger</p>
        </div>

        <div class="glass border border-slate-200 rounded-[2.5rem] p-8 shadow-2xl">
            <form id="loginForm" class="space-y-6">
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest pl-1">Username</label>
                    <input type="text" name="username" required 
                        class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all font-medium text-slate-800"
                        placeholder="Enter your username">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-400 mb-2 uppercase tracking-widest pl-1">Password</label>
                    <input type="password" name="password" required 
                        class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-5 py-4 outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all font-medium text-slate-800"
                        placeholder="••••••••">
                </div>

                <div id="errorMsg" class="hidden p-4 bg-rose-50 text-rose-600 rounded-2xl text-xs font-bold border border-rose-100"></div>

                <button type="submit" id="submitBtn"
                    class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-4 rounded-2xl shadow-lg shadow-emerald-500/30 transition-all transform active:scale-95 flex items-center justify-center gap-2">
                    <span>Sign In</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7-7 7"></path></svg>
                </button>
            </form>

            <div class="mt-8 text-center space-y-4">
                <p class="text-slate-500 text-sm font-medium">Don't have an account? 
                    <a href="/signup" class="text-emerald-600 font-bold hover:underline">Sign up now</a>
                </p>
                <div class="pt-4 border-t border-slate-100">
                    <button onclick="toggleRequestModal()" class="text-xs font-bold text-slate-400 hover:text-emerald-600 transition-colors uppercase tracking-widest flex items-center justify-center gap-2 mx-auto">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"></path></svg>
                        Request Access Key
                    </button>
                </div>
            </div>
        </div>

        <p class="text-center mt-8 text-slate-400 text-xs font-medium uppercase tracking-widest">&copy; 2026 Bitbinders Messenger</p>
    </div>

    <!-- Request Access Modal -->
    <div id="requestModal" class="hidden fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 items-center justify-center p-6">
        <div class="bg-white rounded-[2.5rem] p-8 w-full max-w-sm shadow-2xl animate-in fade-in zoom-in duration-300">
            <h3 class="text-xl font-bold text-slate-900 mb-2 text-center">Request Access</h3>
            <p class="text-slate-500 text-xs text-center mb-6">Admin will review your request and share a unique key.</p>
            
            <form id="requestForm" class="space-y-4">
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">Full Name</label>
                    <input type="text" name="name" required placeholder="Your Name" class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm font-medium">
                </div>
                <div>
                    <label class="block text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1.5 ml-1">WhatsApp / Contact</label>
                    <input type="text" name="contact" required placeholder="+91 ..." class="w-full bg-slate-50 border border-slate-100 rounded-xl px-4 py-3 outline-none focus:ring-2 focus:ring-emerald-500/20 focus:border-emerald-500 transition-all text-sm font-medium">
                </div>
                <div id="requestStatus" class="hidden p-3 rounded-xl text-[10px] font-bold text-center border"></div>
                <button type="submit" id="requestBtn" class="w-full bg-slate-900 text-white font-bold py-3.5 rounded-xl hover:bg-slate-800 transition-all shadow-lg flex items-center justify-center gap-2">
                    Send Request
                </button>
                <button type="button" onclick="toggleRequestModal()" class="w-full text-[10px] font-bold text-slate-400 hover:text-slate-600 uppercase tracking-widest py-2">Cancel</button>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorEl = document.getElementById('errorMsg');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin rounded-full h-5 w-5 border-b-2 border-white"></span>';
            errorEl.classList.add('hidden');

            const formData = new FormData(e.target);
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = data.redirect;
                } else {
                    errorEl.innerText = data.error || 'Login failed';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.innerText = 'Connection error';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        };

        function toggleRequestModal() {
            const modal = document.getElementById('requestModal');
            modal.classList.toggle('hidden');
            modal.classList.toggle('flex');
        }

        document.getElementById('requestForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('requestBtn');
            const status = document.getElementById('requestStatus');
            const formData = new FormData(e.target);
            
            btn.disabled = true;
            btn.innerHTML = 'Sending...';
            status.classList.add('hidden');

            try {
                const res = await fetch('/api/auth/request-access', { method: 'POST', body: formData });
                const data = await res.json();
                status.innerText = data.message;
                status.className = `p-3 rounded-xl text-[10px] font-bold text-center border ${res.ok ? 'bg-emerald-50 text-emerald-600 border-emerald-100' : 'bg-rose-50 text-rose-600 border-rose-100'}`;
                status.classList.remove('hidden');
                if (res.ok) e.target.reset();
            } catch (err) {
                status.innerText = 'Error sending request';
                status.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Send Request';
            }
        };
    </script>
</body>
</html>
