<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Bitbinders Messenger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-green: #ccff00;
            --dark-bg: #000000;
            --slate-depth: #0a0a0a;
        }
        body { 
            font-family: 'Outfit', sans-serif; 
            margin: 0;
            overflow: hidden;
            background: #000000;
            color: white;
        }
        
        /* High-Impact Neon Mesh Background */
        .mesh-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            background-color: #000000;
            background-image: 
                radial-gradient(at 0% 0%, rgba(204, 255, 0, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 0%, rgba(204, 255, 0, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(204, 255, 0, 0.08) 0px, transparent 50%),
                radial-gradient(at 0% 100%, rgba(204, 255, 0, 0.05) 0px, transparent 50%),
                radial-gradient(at 50% 50%, rgba(0, 0, 0, 1) 0px, transparent 80%);
            filter: blur(100px);
            animation: meshMove 25s ease-in-out infinite alternate;
        }

        @keyframes meshMove {
            0% { transform: scale(1); }
            100% { transform: scale(1.1) rotate(2deg); }
        }

        .glass-card {
            background: rgba(10, 10, 10, 0.6);
            backdrop-filter: blur(30px) saturate(150%);
            -webkit-backdrop-filter: blur(30px) saturate(150%);
            border: 1px solid rgba(204, 255, 0, 0.1);
            box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.8), 0 0 20px rgba(204, 255, 0, 0.03);
        }

        .input-dark {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: white;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .input-dark:focus {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--neon-green);
            box-shadow: 0 0 15px rgba(204, 255, 0, 0.1);
        }

        .btn-neon {
            background: var(--neon-green);
            color: #000000;
            font-weight: 900;
            letter-spacing: 0.05em;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .btn-neon:hover {
            box-shadow: 0 0 40px rgba(204, 255, 0, 0.5);
            transform: scale(1.02);
        }

        .text-neon { color: var(--neon-green); }
        .border-neon { border-color: rgba(204, 255, 0, 0.2); }
        .bg-neon-faint { background: rgba(204, 255, 0, 0.05); }

        .animate-up {
            animation: slideUp 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6 bg-black">
    <div class="mesh-bg"></div>

    <div class="w-full max-w-[440px] animate-up">
        <!-- Logo Area -->
        <div class="text-center mb-10">
            <div class="inline-flex items-center justify-center w-20 h-20 rounded-[2rem] bg-neon-faint border border-neon mb-6 shadow-2xl relative group transition-all duration-500 hover:scale-110">
                <div class="absolute inset-0 rounded-[2rem] bg-[#ccff00]/20 blur-xl opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <svg class="w-10 h-10 text-neon relative z-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
            </div>
            <h1 class="text-5xl font-black text-white mb-3 tracking-tighter">BEYOND <span class="text-neon">DIGITAL</span></h1>
            <p class="text-slate-500 font-bold uppercase tracking-[0.3em] text-[10px]">Messenger Analytics Hub</p>
        </div>

        <!-- Login Card -->
        <div class="glass-card rounded-[2.5rem] p-10 relative overflow-hidden border-neon">
            <!-- Decorative accent line at top -->
            <div class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-[#ccff00]/40 to-transparent"></div>
            
            <form id="loginForm" class="space-y-8 relative z-10">
                <div class="space-y-3">
                    <label class="block text-[11px] font-black text-slate-500 uppercase tracking-[0.25em] ml-1">Identity</label>
                    <div class="relative group">
                        <span class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-neon transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </span>
                        <input type="text" name="username" required 
                            class="w-full input-dark rounded-2xl pl-14 pr-6 py-4.5 outline-none font-bold text-white placeholder:text-slate-700"
                            placeholder="USERNAME">
                    </div>
                </div>

                <div class="space-y-3">
                    <label class="block text-[11px] font-black text-slate-500 uppercase tracking-[0.25em] ml-1">Secret Key</label>
                    <div class="relative group">
                        <span class="absolute left-5 top-1/2 -translate-y-1/2 text-slate-500 group-focus-within:text-neon transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </span>
                        <input type="password" name="password" required id="passwordInput"
                            class="w-full input-dark rounded-2xl pl-14 pr-14 py-4.5 outline-none font-bold text-white placeholder:text-slate-700"
                            placeholder="••••••••">
                        <button type="button" onclick="togglePassword()" class="absolute right-5 top-1/2 -translate-y-1/2 text-slate-500 hover:text-neon transition-colors">
                            <svg id="eyeIcon" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                        </button>
                    </div>
                </div>

                <div id="errorMsg" class="hidden p-4 bg-rose-500/10 text-rose-400 rounded-2xl text-[11px] font-black border border-rose-500/20 tracking-wider">
                    <!-- Error text here -->
                </div>

                <button type="submit" id="submitBtn"
                    class="w-full btn-neon py-5 rounded-2xl shadow-2xl flex items-center justify-center gap-3 active:opacity-90 active:scale-[0.98]">
                    <span>ENTER TERMINAL</span>
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M13 7l5 5m0 0l-5 5m5-5H6"></path></svg>
                </button>
            </form>

            <div class="mt-10 text-center relative z-10">
                <p class="text-slate-600 text-[11px] font-bold uppercase tracking-widest">New Presence? 
                    <a href="/signup" class="text-neon hover:text-white transition-colors ml-1 decoration-neon/30 underline-offset-8 hover:underline italic">Create Credentials</a>
                </p>
            </div>
        </div>

        <p class="text-center mt-12 text-slate-800 text-[9px] font-black uppercase tracking-[0.5em] opacity-40">&copy; 2026 Bitbinders Beyond Digital</p>
    </div>

    <script>
        function togglePassword() {
            const input = document.getElementById('passwordInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18"></path>';
            } else {
                input.type = 'password';
                icon.innerHTML = '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>';
            }
        }

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const errorEl = document.getElementById('errorMsg');
            const originalText = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = '<span class="animate-spin rounded-full h-5 w-5 border-b-2 border-black"></span>';
            errorEl.classList.add('hidden');

            const formData = new FormData(e.target);
            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (res.ok) {
                    window.location.href = data.redirect;
                } else {
                    errorEl.innerText = data.error || 'ACCESS DENIED: IDENTITY UNKNOWN';
                    errorEl.classList.remove('hidden');
                }
            } catch (err) {
                errorEl.innerText = 'LINK FAILURE: CHECK NEURAL CONNECTION';
                errorEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        };
    </script>
</body>
</html>
